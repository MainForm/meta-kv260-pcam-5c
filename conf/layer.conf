require ${LAYERDIR}/conf/kv260-settings.inc

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kv260"
BBFILE_PATTERN_meta-kv260 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kv260 = "6"

LAYERDEPENDS_meta-kv260 = "core"
LAYERSERIES_COMPAT_meta-kv260 = "scarthgap"

# Capture this layer's absolute path.
KV260_LAYER_DIR := "${LAYERDIR}"